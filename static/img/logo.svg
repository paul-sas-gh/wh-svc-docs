<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <linearGradient id="hexMetal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a2a3f;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#2c4a6f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a2a3f;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="plasmaIn" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:0" />
            <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="plasmaOut" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#4facfe;stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0" />
        </linearGradient>

        <radialGradient id="coreShield" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#00f2fe;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.2" />
        </radialGradient>

        <filter id="plasmaGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <polygon id="hexShape" points="0,-20 17.32,-10 17.32,10 0,20 -17.32,10 -17.32,-10" />
    </defs>

    <g transform="translate(100, 100)">
        <g stroke="#00f2fe" stroke-width="1" fill="url(#hexMetal)">
            <use href="#hexShape" transform="translate(0, -35)" opacity="0.8"/>
            <use href="#hexShape" transform="translate(0, 35)" opacity="0.8"/>
            <use href="#hexShape" transform="translate(30.3, -17.5)" opacity="0.8"/>
            <use href="#hexShape" transform="translate(30.3, 17.5)" opacity="0.8"/>
            <use href="#hexShape" transform="translate(-30.3, -17.5)" opacity="0.8"/>
            <use href="#hexShape" transform="translate(-30.3, 17.5)" opacity="0.8"/>
        </g>

        <g filter="url(#plasmaGlow)">
            <use href="#hexShape" fill="url(#coreShield)" stroke="#ffffff" stroke-width="2"/>
        </g>
    </g>

    <g filter="url(#plasmaGlow)">
        <path d="M 10,50 L 60,70 L 75,70 L 25,50 Z" fill="url(#plasmaIn)" />
        <use href="#hexShape" transform="translate(40, 60) scale(0.3)" fill="#ffffff"/>

        <path d="M 10,150 L 60,130 L 75,130 L 25,150 Z" fill="url(#plasmaIn)" />
        <use href="#hexShape" transform="translate(40, 140) scale(0.3)" fill="#ffffff"/>
    </g>

    <g filter="url(#plasmaGlow)">
        <path d="M 125,70 L 140,70 L 190,50 L 175,50 Z" fill="url(#plasmaOut)" />
        <use href="#hexShape" transform="translate(160, 60) scale(0.3)" fill="#ffffff"/>

        <path d="M 125,130 L 140,130 L 190,150 L 175,150 Z" fill="url(#plasmaOut)" />
        <use href="#hexShape" transform="translate(160, 140) scale(0.3)" fill="#ffffff"/>
    </g>

</svg>